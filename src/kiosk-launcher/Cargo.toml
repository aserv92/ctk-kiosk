[package]
name = "kiosk-launcher"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "kiosk-launcher"
path = "main.rs"

[dependencies]
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
x11rb = "0.13.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
