[package]
name = "ctk-installer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
png = "0.17"
x11rb = { version = "0.13.1", features = ["randr"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
